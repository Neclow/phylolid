[workspace]
authors = ["Neclow <neilclow24@gmail.com>"]
channels = ["conda-forge"]
name = "phylolid"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
post_install = "bash scripts/post_install.sh"
download_glotlid = "python -m pipeline.download_glotlid"
download_omnilingual = "python -m pipeline.download_omnilingual"
map_glottolog = "python -m pipeline.map_glottolog"
download_reference_trees = "python -m pipeline.download_reference_trees"
download_reference_trees_all = "python -m pipeline.download_reference_trees --glottocode all"
download_models = "python -m pipeline.download_models"
train_test_heldout_split = "python -m pipeline.train_test_heldout_split"
evaluate = "python -m pipeline.evaluate"
build_vocab = "python -m pipeline.build_vocab"
train = "python -m pipeline.train"
list_runs = "python -m pipeline.list_runs"
test = "python -m pytest tests"

[dependencies]
ipykernel = ">=7.4.0,<8"
fasttext = ">=0.9.2,<0.10"
huggingface_hub = ">=1.32.0,<2"
numpy = "<2.0"
regex = ">=2026.9.29,<2027"
pandas = ">=3.0.6,<4"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"
scikit-learn = ">=1.9.1,<2"
tabulate = ">=0.10.0,<0.11"
wandb = ">=0.30.0,<0.31"
ty = ">=0.0.84,<0.0.85"
pre-commit = ">=4.6.2,<5"
gfortran = ">=16.2.0,<17"
ete4 = ">=4.4.0,<5"
langcodes = ">=3.5.1,<4"
language-data = ">=1.4.0,<2"
pyarrow = ">=24.0.0,<25"
pytest = ">=9.1.1,<10"
fonttools = ">=4.66.1,<5"
# To build the patched gcld3 below: C++ compiler, protobuf (protoc and headers), pybind11
cxx-compiler = "*"
libprotobuf = ">=6.33.5,<7"
pybind11 = ">=3.1.0,<4"
setuptools = ">=84.0.0,<85"
pyyaml = ">=6.0.3,<7"

[pypi-dependencies]
pyglottolog = ">=4.0.1, <5"
torch = ">=2.14.1, <3"
lightning = ">=2.6.6, <3"
transformers = ">=5.19.0, <6"
pyfranc = ">=0.2.3, <0.3"
torchmetrics = ">=1.9.0, <2"
# CLD3 with the probabilities of all languages (Result.probabilities), patched in a fork of google/cld3 at gcld3 3.0.13
gcld3 = { git = "https://github.com/Neclow/cld3", rev = "e43e5b2b3ee6a62908197e703fa3662ac47b3893" }

[pypi-options]
# Built against the environment's protoc, protobuf headers and pybind11
no-build-isolation = ["gcld3"]

[activation]
# Loads the gitignored .env (e.g. the wandb project and entity) into every pixi command
scripts = ["scripts/load_env.sh"]
