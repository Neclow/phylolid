[workspace]
authors = ["Neclow <neilclow24@gmail.com>"]
channels = ["conda-forge"]
name = "phylolid"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
post_install = "bash scripts/post_install.sh"
download_glotlid = "python -m pipeline.download_glotlid"
download_glottolog = "python -m pipeline.download_glottolog"
download_reference_trees = "python -m pipeline.download_reference_trees"
download_reference_trees_all = "python -m pipeline.download_reference_trees --glottocode all"
download_models = "python -m pipeline.download_models"

[dependencies]
ipykernel = ">=7.4.0,<8"
fasttext = ">=0.9.2,<0.10"
huggingface_hub = ">=1.32.0,<2"
numpy = "<2.0"
regex = ">=2026.9.29,<2027"
pandas = ">=3.0.6,<4"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"
scikit-learn = ">=1.9.1,<2"
tabulate = ">=0.10.0,<0.11"
wandb = ">=0.30.0,<0.31"
ty = ">=0.0.84,<0.0.85"
pre-commit = ">=4.6.2,<5"
gfortran = ">=16.2.0,<17"
ete4 = ">=4.4.0,<5"
gcld3 = ">=3.0.13,<4"

[pypi-dependencies]
pyglottolog = ">=4.0.1, <5"
torch = ">=2.14.1, <3"
lightning = ">=2.6.6, <3"
transformers = ">=5.19.0, <6"
pyfranc = ">=0.2.3, <0.3"
